<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StandardIssue Advanced</title>
<link rel="stylesheet" href="dist/app.css">
<link rel="stylesheet" href="reader.css">
</head>
<body class="h-screen overflow-hidden flex flex-col bg-surface-container-lowest text-on-surface font-body text-body-md antialiased">

<!-- Lock screen: another copy of the app holds the instance lock -->
<div id="lock-screen" class="fixed inset-x-0 bottom-0 top-8 z-[1000] bg-surface flex flex-col items-center justify-center gap-3 p-6 text-center" hidden>
  <span class="material-symbols-outlined text-[40px] text-primary">lock_clock</span>
  <h2 id="lock-title" class="font-display text-headline-md">Waiting…</h2>
  <p id="lock-detail" class="text-body-sm text-outline"></p>
</div>

<!-- Title bar (custom window chrome) -->
<div id="titlebar" data-tauri-drag-region
     class="h-8 shrink-0 bg-surface-container-lowest flex items-center justify-between pl-space-md z-50 select-none shadow-[0_1px_8px_rgba(0,0,0,0.4)]">
  <div class="flex items-center gap-space-sm pointer-events-none">
    <span class="material-symbols-outlined text-[16px] text-primary">auto_stories</span>
    <span class="text-label-sm uppercase tracking-wider text-on-surface-variant font-semibold">Standard Issue</span>
    <span id="tb-version" class="text-label-sm text-outline px-1.5 py-0.5 rounded-lg bg-surface-container">Advanced</span>
  </div>
  <div class="flex items-center h-full">
    <button id="tb-sync" class="flex items-center gap-1.5 px-space-sm py-0.5 mr-space-md rounded-lg bg-surface-container-low hover:bg-surface-container" title="GitHub Sync Status"></button>
    <button data-route="logs" class="h-full px-2 text-on-surface-variant hover:text-primary" title="Archival Build Logs">
      <span class="material-symbols-outlined text-[16px]">terminal</span>
    </button>
    <button id="win-min" class="h-full w-11 grid place-items-center text-on-surface-variant hover:bg-surface-container-high" title="Minimize">
      <span class="material-symbols-outlined text-[16px]">remove</span>
    </button>
    <button id="win-max" class="h-full w-11 grid place-items-center text-on-surface-variant hover:bg-surface-container-high" title="Maximize">
      <span class="material-symbols-outlined text-[16px]">crop_square</span>
    </button>
    <button id="win-close" class="h-full w-11 grid place-items-center text-on-surface-variant hover:bg-red-600 hover:text-white" title="Close">
      <span class="material-symbols-outlined text-[16px]">close</span>
    </button>
  </div>
</div>

<div class="flex flex-1 min-h-0">
  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 shrink-0 bg-surface-container-low z-40 flex flex-col justify-between py-space-md shadow-[0_10px_30px_rgba(0,0,0,0.45)] overflow-y-auto"></aside>

  <div class="flex-1 min-w-0 flex flex-col">
    <!-- Command toolbar -->
    <header id="toolbar" class="shrink-0 bg-surface-container-low/90 backdrop-blur-xl z-30 shadow-[0_1px_8px_rgba(0,0,0,0.3)]"></header>

    <main id="main" class="flex-1 min-h-0 overflow-y-auto bg-surface px-margin pt-space-lg pb-space-xl">
      <div id="library-view" class="flex flex-col w-full">
        <section id="hero" class="mb-space-lg"></section>
        <section id="tabs" class="mb-space-md"></section>
        <div id="active-filters" class="mb-space-md flex flex-wrap gap-1.5" hidden></div>
        <div class="relative grid grid-cols-12 gap-gutter items-start">
          <section id="shelf" class="col-span-12 flex flex-col gap-space-lg"></section>
          <aside id="inspector" class="col-span-12 xl:col-span-4 2xl:col-span-3 sticky top-0 bg-surface-container-low rounded-2xl p-space-md shadow-2xl flex flex-col gap-space-md"></aside>
        </div>
      </div>
      <div id="page-view" hidden></div>
    </main>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script type="module" src="reader.js"></script>
</body>
</html>
